# extraction_config.yaml
# Example config for a regex + context extractor.
# Replace the patterns and keywords with your own; keep the structure.

settings:
  context_window_words: 8        # words to look at on each side of a match
  context_direction: both        # which side(s) to search: before | after | both
  stop_at: ""                    # chars that end the context scan, e.g. ".!?" to stay in one sentence
  distance_decay: true           # closer keywords count more (weight / distance)
  min_score: 0                   # drop candidates scoring below this
  case_sensitive: false
  overlap_tiebreak:              # applied in order when overlapping spans conflict
    - score                      # higher score (text + context) wins
    - length                     # then longer match
    - priority                   # then lower priority number wins
                                 # Anything still tied (or an empty list) goes to the
                                 #   earlier start, then the alphabetical label.

normalize:
  collapse_whitespace: true
  unicode_dashes_to_hyphen: true # – — → -
  smart_quotes_to_ascii: true

patterns:
  # Every pattern runs on every text. A match's score is the sum of the weights
  # of its pattern's words found around it:
  #   keywords: {word: weight}   # in the text window AND in the context string
  #   nearby:   {word: weight}   # in the text window only
  #   context:  {word: weight}   # in the context string only
  # Weights are signed (negative lowers the score; 0 is an error). A word in
  # `keywords` may not also be in `nearby` or `context`.
  # The text window is context_window_words words on each side of the match.
  # The context string is read whole; its last word counts as the closest
  # (distance 1) when distance_decay is on.

  - label: invoice_number
    priority: 1
    regex: '\b(?:INV|INVOICE)[-\s#]?\d{5,8}\b'
    keywords: {invoice: 3, bill: 2, "amount due": 2, ref: 1, phone: -3, tel: -3}

  - label: phone_number
    priority: 2
    regex: |
      (?x)                       # verbose mode: comments allowed
      (?:\+?1[-.\s]?)?           # optional country code
      \(?\d{3}\)?[-.\s]?         # area code
      \d{3}[-.\s]?\d{4}\b
    keywords: {phone: 3, tel: 3, call: 2, mobile: 2, fax: 1, invoice: -2, account: -2, order: -1}

  - label: account_number
    priority: 3
    regex: '\b\d{10}\b'          # overlaps with phone_number on purpose
    keywords: {account: 3, acct: 3, routing: 1, phone: -3, call: -2}

  - label: timestamp
    priority: 1
    regex: '\b\d{4}-\d{2}-\d{2}[T\s]\d{2}:\d{2}(?::\d{2})?\b'
    keywords: {at: 1, logged: 2, created: 2}

  - label: date
    priority: 2
    regex: '\b(?:\d{4}-\d{2}-\d{2}|\d{1,2}/\d{1,2}/\d{2,4})\b'
    keywords: {date: 2, due: 2, dated: 2, "on": 1}   # quoted: bare `on` is YAML true

  - label: amount
    priority: 2
    regex: '(?:\$|USD\s?)\d{1,3}(?:,\d{3})*(?:\.\d{2})?'
    keywords: {total: 3, due: 2, amount: 2, balance: 2}

# Label pairs that may BOTH be kept when they overlap.
# Any overlapping pair not listed here goes through overlap_tiebreak.
coexist:
  - [timestamp, date]            # keep the date inside a timestamp
  - [invoice_number, amount]

# Test cases the program must pass (run with: pytest)
tests:
  - text: "Please call 555-123-4567 about the order."
    expect:
      - {label: phone_number, text: "555-123-4567"}

  - text: "Acct 5551234567 is overdue."
    expect:
      - {label: account_number, text: "5551234567"}

  - text: "Invoice INV-004521 dated 03/14/2026, amount due $1,250.00"
    expect:
      - {label: invoice_number, text: "INV-004521"}
      - {label: date, text: "03/14/2026"}
      - {label: amount, text: "$1,250.00"}

  - text: "Record created 2026-03-14 09:30:00 by admin."
    expect:
      - {label: timestamp, text: "2026-03-14 09:30:00"}
      - {label: date, text: "2026-03-14"}

  # Optional `context` per case: its words add to the score of every pattern
  # that lists them. All patterns still run on the text.
  - name: without context the 10-digit number reads as a phone (call is next to it)
    text: "5551234567 call"
    expect:
      - {label: phone_number, text: "5551234567"}

  - name: context "account" flips the same overlap (account +3, phone -2)
    context: "account"
    text: "5551234567 call"
    expect:
      - {label: account_number, text: "5551234567"}

  - name: context wins the overlap; the separate phone number is still found
    context: "Acct"
    text: "Acct 5551234567 call 555-123-4567"
    expect:
      - {label: account_number, text: "5551234567"}
      - {label: phone_number, text: "555-123-4567"}

  - name: context phrase adds to every pattern listing it; nothing is excluded
    context: "amount due"
    text: "Invoice INV-004521 dated 03/14/2026, amount due $1,250.00 call 555-123-4567"
    expect:
      - {label: invoice_number, text: "INV-004521"}
      - {label: date, text: "03/14/2026"}
      - {label: amount, text: "$1,250.00"}
      - {label: phone_number, text: "555-123-4567"}

  - name: context with no keyword hits changes nothing
    context: "nothing relevant here"
    text: "Invoice INV-004521 dated 03/14/2026 on 2026-03-14"
    expect:
      - {label: invoice_number, text: "INV-004521"}
      - {label: date, text: "03/14/2026"}
      - {label: date, text: "2026-03-14"}

  - name: '"on" in the context scores date (YAML used to read bare on as true)'
    context: "invoice on file"
    text: "Invoice INV-004521 dated 03/14/2026"
    expect:
      - {label: invoice_number, text: "INV-004521"}
      - {label: date, text: "03/14/2026"}

  - name: context points to phone_number but the text has none (a `miss` row)
    context: "call me"
    text: "Invoice INV-004521"
    expect:
      - {label: invoice_number, text: "INV-004521"}
